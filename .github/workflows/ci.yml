name: LOGISTICS-FRONTEND

on:
  push:
    branches:
      - master
      - staging
    tags:
      - "v*"
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "nginx.conf"
      - "docker-entrypoint.sh"
      - ".github/workflows/**"

concurrency:
  group: logistics-frontend
  cancel-in-progress: true

jobs:

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_version: ${{ steps.get_version.outputs.VERSION }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --run

      # - name: Run Lint
      #   run: npm run lint

      - name: Login Docker Registry
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_CREDENTIAL }}

      - name: Generate Image Version
        id: get_version
        run: |
          DATE=$(date +'%Y.%m.%d')
          BUILD_NUMBER=${{ github.run_number }}
          VERSION="${DATE}.${BUILD_NUMBER}"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true

          tags: |
            ${{ secrets.DOCKER_REGISTRY_USER }}/${{ vars.DOCKER_IMAGE }}:${{ steps.get_version.outputs.VERSION }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Server

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |

            set -e

            CONTAINER_NAME="logistics-frontend"

            IMAGE_NAME="${{ secrets.DOCKER_REGISTRY_USER }}/${{ vars.DOCKER_IMAGE }}:${{ needs.build-and-push.outputs.image_version }}"

            HOST_PORT=5173
            CONTAINER_PORT=80

            RESTART_POLICY="--restart unless-stopped"

            ENV_VARS="
            -e VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            "

            echo "Pull image..."

            docker pull $IMAGE_NAME


            if docker ps -aq -f name=^/${CONTAINER_NAME}$ > /dev/null; then

              if docker ps -q -f name=^/${CONTAINER_NAME}$ > /dev/null; then
                docker stop $CONTAINER_NAME
              fi

              docker rm $CONTAINER_NAME

            fi


            echo "Start new container..."

            docker run -d \
              --name $CONTAINER_NAME \
              -p $HOST_PORT:$CONTAINER_PORT \
              $ENV_VARS \
              $RESTART_POLICY \
              $IMAGE_NAME

  check-log:
    name: Check Deployment

    runs-on: ubuntu-latest

    needs:
      - deploy

    steps:

      - name: Check Container
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |

            CONTAINER_NAME="logistics-frontend"

            echo "========== CONTAINER =========="

            docker ps --filter name=$CONTAINER_NAME

            echo

            echo "========== HTTP =========="

            curl -I http://192.168.154.44:5173 || true

            echo

            echo "========== LOG =========="

            docker logs $CONTAINER_NAME --tail 50
