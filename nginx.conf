server {

    listen 5173;

    server_name 192.168.154.44;

    root /usr/share/nginx/html;

    index index.html;


    location / {

        try_files $uri $uri/ /index.html;

    }


    gzip on;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

}
